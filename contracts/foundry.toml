[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
# Public endpoints (rate-limited). For a private RPC pass it directly: --rpc-url $BASE_RPC_URL
base = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"

[etherscan]
# Basescan via the Etherscan V2 multichain API (one ETHERSCAN_API_KEY covers both).
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

[lint]
exclude_lints = ["asm-keccak256"]
